name: Publish Windows preview

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, version and release notes
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -Raw src/DesktopRug.App/DesktopRug.App.csproj
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Release tag must exactly match the application Version, prefixed with v.'
          }
          $notes = "docs/releases/$version.md"
          if (!(Test-Path -LiteralPath $notes) -or [string]::IsNullOrWhiteSpace((Get-Content -Raw -LiteralPath $notes))) {
            throw "Missing release notes: $notes"
          }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checked-out commit.' }
          $eventCommit = git rev-parse "$env:GITHUB_SHA^{}"
          if ($LASTEXITCODE -ne 0 -or $source -cne $eventCommit) { throw 'Checkout does not match the tag event.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_SOURCE=$source" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          # Matches the single-file ILLink version in packages.win-x64.lock.json.
          dotnet-version: '10.0.401'
      - name: Select the exact release SDK
        run: |
          # The development global.json allows roll-forward; the release checkout must not.
          @{ sdk = @{ version = '10.0.401'; rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
          if ((dotnet --version) -cne '10.0.401') { throw 'The pinned release SDK is unavailable.' }
      - name: Restore, build and test
        run: |
          dotnet restore DesktopRug.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build DesktopRug.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true "-p:PathMap=$env:GITHUB_WORKSPACE=/_/DesktopRug"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/DesktopRug.Tests/DesktopRug.Tests.csproj -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable executable and package licenses
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore src/DesktopRug.App/DesktopRug.App.csproj -p:RuntimeIdentifier=win-x64 --locked-mode -p:SelfContained=true -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/DesktopRug.App/DesktopRug.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:ContinuousIntegrationBuild=true "-p:PathMap=$env:GITHUB_WORKSPACE=/_/DesktopRug" -o artifacts/release/portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = (Resolve-Path artifacts/release/portable).Path
          if (!(Test-Path -LiteralPath "$folder/DesktopRug.exe")) { throw 'Portable executable is missing.' }
          foreach ($license in Get-ChildItem licenses -File) {
            if (!(Test-Path -LiteralPath (Join-Path "$folder/licenses" $license.Name))) { throw "Missing packaged license: $($license.Name)" }
          }
          Copy-Item -LiteralPath THIRD-PARTY-NOTICES.md -Destination $folder
          $asset = "artifacts/release/DesktopRug-$env:RELEASE_VERSION-win-x64.zip"
          $timestamp = [DateTimeOffset](git show -s --format=%cI $env:RELEASE_SOURCE)
          $archive = [IO.Compression.ZipFile]::Open($asset, [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($file in Get-ChildItem -LiteralPath $folder -File -Recurse | Sort-Object FullName) {
              $relative = [IO.Path]::GetRelativePath($folder, $file.FullName).Replace('\', '/')
              $entry = $archive.CreateEntry($relative, [IO.Compression.CompressionLevel]::Optimal)
              $entry.LastWriteTime = $timestamp
              $inputStream = [IO.File]::OpenRead($file.FullName)
              $outputStream = $entry.Open()
              try { $inputStream.CopyTo($outputStream) } finally { $inputStream.Dispose(); $outputStream.Dispose() }
            }
          } finally { $archive.Dispose() }
          "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV
      - name: Publish verified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $assetName = [IO.Path]::GetFileName($env:RELEASE_ASSET)
          $digest = (Get-FileHash -LiteralPath $env:RELEASE_ASSET -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceMarker = "<!-- desktoprug-source:$env:RELEASE_SOURCE -->"
          $notesFile = 'artifacts/release/release-notes.md'
          $notes = Get-Content -Raw -LiteralPath "docs/releases/$env:RELEASE_VERSION.md"
          "$notes`n`n$sourceMarker`n<!-- desktoprug-asset-sha256:$digest -->" | Set-Content -LiteralPath $notesFile -Encoding utf8
          function Read-Release {
            try { Invoke-RestMethod "$api/releases/tags/$tag" -Headers $headers }
            catch {
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
              # Published-tag lookup may omit drafts; authenticated listing includes them.
              $found = $null
              for ($page = 1; ; $page++) {
                # Invoke-RestMethod emits JSON arrays as one pipeline object; normalize after assignment.
                $batch = Invoke-RestMethod "$api/releases?per_page=100&page=$page" -Headers $headers
                $batch = @($batch)
                $matching = @($batch | Where-Object tag_name -CEQ $tag)
                if ($matching.Count -gt 1 -or ($null -ne $found -and $matching.Count -eq 1)) { throw 'More than one release uses this tag.' }
                if ($matching.Count -eq 1) { $found = $matching[0] }
                if ($batch.Count -lt 100) { return $found }
              }
            }
          }
          function Assert-Source($release) {
            $commit = Invoke-RestMethod "$api/commits/$tag" -Headers $headers
            if ($commit.sha -cne $env:RELEASE_SOURCE) { throw 'Remote tag moved; refusing release mutation.' }
            if ($release -and ($release.tag_name -cne $tag -or $release.target_commitish -cne $env:RELEASE_SOURCE -or !([string]$release.body).Contains($sourceMarker) -or !$release.prerelease)) {
              throw 'Existing release does not match this source commit and preview workflow.'
            }
          }
          $release = Read-Release
          Assert-Source $release
          if (!$release) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --target $env:RELEASE_SOURCE --title "Desktop Rug $tag · Preview" --notes-file $notesFile --draft --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
            $release = Read-Release
          }
          Assert-Source $release
          $assets = @($release.assets | Where-Object name -eq $assetName)
          if ($assets.Count -gt 1) { throw 'Duplicate release asset names; refusing replacement.' }
          if ($assets.Count -eq 0) {
            if ($release.draft) {
              gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notesFile
              if ($LASTEXITCODE -ne 0) { throw 'Could not update draft artifact digest.' }
            } elseif (!$release.body.Contains("<!-- desktoprug-asset-sha256:$digest -->")) {
              throw 'Published release expects a different build; no asset was replaced.'
            }
            gh release upload $tag $env:RELEASE_ASSET --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; rerun this workflow to resume the draft.' }
          }
          $release = Read-Release
          Assert-Source $release
          $asset = @($release.assets | Where-Object name -eq $assetName)
          $recordedDigest = [regex]::Match($release.body, '<!-- desktoprug-asset-sha256:([a-f0-9]{64}) -->').Groups[1].Value
          if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].size -le 0 -or !$recordedDigest -or $asset[0].digest -cne "sha256:$recordedDigest") {
            throw 'Release asset is incomplete or its SHA-256 does not match the recorded build; nothing was overwritten.'
          }
          if ($release.draft) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft=false --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; verified assets remain in the draft.' }
          }
          $release = Read-Release
          Assert-Source $release
          if ($release.draft -or !$release.prerelease) { throw 'Release did not reach published-preview status.' }
          "Published preview: $($release.html_url)" >> $env:GITHUB_STEP_SUMMARY
          "Download: $($asset[0].browser_download_url)" >> $env:GITHUB_STEP_SUMMARY
