name: Publish Windows preview

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, version and release notes
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -Raw src/DesktopRug.App/DesktopRug.App.csproj
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Release tag must exactly match the application Version, prefixed with v.'
          }
          $notes = "docs/releases/$version.md"
          if (!(Test-Path -LiteralPath $notes) -or [string]::IsNullOrWhiteSpace((Get-Content -Raw -LiteralPath $notes))) {
            throw "Missing release notes: $notes"
          }
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checked-out commit.' }
          $eventCommit = git rev-parse "$env:GITHUB_SHA^{}"
          if ($LASTEXITCODE -ne 0 -or $source -cne $eventCommit) { throw 'Checkout does not match the tag event.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_SOURCE=$source" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          # Matches the single-file ILLink version in packages.win-x64.lock.json.
          dotnet-version: '10.0.401'
      - name: Select the exact release SDK
        run: |
          # The development global.json allows roll-forward; the release checkout must not.
          @{ sdk = @{ version = '10.0.401'; rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
          if ((dotnet --version) -cne '10.0.401') { throw 'The pinned release SDK is unavailable.' }
      - name: Restore, build and test
        run: |
          dotnet restore DesktopRug.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build DesktopRug.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true "-p:PathMap=$env:GITHUB_WORKSPACE=/_/DesktopRug"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/DesktopRug.Tests/DesktopRug.Tests.csproj -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish portable executable and package licenses
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore src/DesktopRug.App/DesktopRug.App.csproj -p:RuntimeIdentifier=win-x64 --locked-mode -p:SelfContained=true -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/DesktopRug.App/DesktopRug.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:ContinuousIntegrationBuild=true "-p:PathMap=$env:GITHUB_WORKSPACE=/_/DesktopRug" -o artifacts/release/portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = (Resolve-Path artifacts/release/portable).Path
          if (!(Test-Path -LiteralPath "$folder/DesktopRug.exe")) { throw 'Portable executable is missing.' }
          foreach ($license in Get-ChildItem licenses -File) {
            if (!(Test-Path -LiteralPath (Join-Path "$folder/licenses" $license.Name))) { throw "Missing packaged license: $($license.Name)" }
          }
          Copy-Item -LiteralPath THIRD-PARTY-NOTICES.md -Destination $folder
          $asset = "artifacts/release/DesktopRug-$env:RELEASE_VERSION-win-x64.zip"
          $timestamp = [DateTimeOffset](git show -s --format=%cI $env:RELEASE_SOURCE)
          $archive = [IO.Compression.ZipFile]::Open($asset, [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($file in Get-ChildItem -LiteralPath $folder -File -Recurse | Sort-Object FullName) {
              $relative = [IO.Path]::GetRelativePath($folder, $file.FullName).Replace('\', '/')
              $entry = $archive.CreateEntry($relative, [IO.Compression.CompressionLevel]::Optimal)
              $entry.LastWriteTime = $timestamp
              $inputStream = [IO.File]::OpenRead($file.FullName)
              $outputStream = $entry.Open()
              try { $inputStream.CopyTo($outputStream) } finally { $inputStream.Dispose(); $outputStream.Dispose() }
            }
          } finally { $archive.Dispose() }
          "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV
      - name: Compile Windows setup
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (!$compiler) {
            $candidates = @("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe", "$env:ProgramFiles/Inno Setup 6/ISCC.exe")
            $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (!$compiler) { throw 'Inno Setup 6 is missing from this Windows runner image.' }
          $portable = (Resolve-Path artifacts/release/portable).Path
          $destination = (Resolve-Path artifacts/release).Path
          & $compiler "/DAppVersion=$env:RELEASE_VERSION" "/DSourceDir=$portable" "/DOutputDir=$destination" packaging/desktop-rug.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $destination "DesktopRug-$env:RELEASE_VERSION-Setup-x64.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw 'Windows setup executable is missing.' }
          "RELEASE_INSTALLER=$installer" >> $env:GITHUB_ENV
      - name: Verify install, upgrade and uninstall on disposable runner
        run: |
          pwsh -NoProfile -File scripts/test-installer.ps1 -InstallerPath $env:RELEASE_INSTALLER -ExpectedVersion $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain installer smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopRug-installer-smoke
          path: ${{ runner.temp }}/DesktopRug-installer-*/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish verified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $packages = @($env:RELEASE_ASSET, $env:RELEASE_INSTALLER) | ForEach-Object {
            [pscustomobject]@{ Path = $_; Name = [IO.Path]::GetFileName($_); Digest = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $sourceMarker = "<!-- desktoprug-source:$env:RELEASE_SOURCE -->"
          $notesFile = 'artifacts/release/release-notes.md'
          $notes = Get-Content -Raw -LiteralPath "docs/releases/$env:RELEASE_VERSION.md"
          function Digest-Marker([string]$Name, [string]$Hash) { "<!-- desktoprug-asset:${Name}:sha256:$Hash -->" }
          $markers = ($packages | ForEach-Object { Digest-Marker $_.Name $_.Digest }) -join "`n"
          "$notes`n`n$sourceMarker`n$markers" | Set-Content -LiteralPath $notesFile -Encoding utf8
          function Read-Release([long]$Id = 0) {
            $endpoint = if ($Id -gt 0) { "$api/releases/$Id" } else { "$api/releases/tags/$tag" }
            try { Invoke-RestMethod $endpoint -Headers $headers -TimeoutSec 15 }
            catch {
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
              if ($Id -gt 0) { return $null }
              # Published-tag lookup may omit drafts; authenticated listing includes them.
              $found = $null
              for ($page = 1; ; $page++) {
                # Invoke-RestMethod emits JSON arrays as one pipeline object; normalize after assignment.
                $batch = Invoke-RestMethod "$api/releases?per_page=100&page=$page" -Headers $headers -TimeoutSec 15
                $batch = @($batch)
                $matching = @($batch | Where-Object tag_name -CEQ $tag)
                if ($matching.Count -gt 1 -or ($null -ne $found -and $matching.Count -eq 1)) { throw 'More than one release uses this tag.' }
                if ($matching.Count -eq 1) { $found = $matching[0] }
                if ($batch.Count -lt 100) { return $found }
              }
            }
          }
          function Assert-Source($release) {
            $commit = Invoke-RestMethod "$api/commits/$tag" -Headers $headers -TimeoutSec 15
            if ($commit.sha -cne $env:RELEASE_SOURCE) { throw 'Remote tag moved; refusing release mutation.' }
            if ($release -and ($release.tag_name -cne $tag -or $release.target_commitish -cne $env:RELEASE_SOURCE -or !([string]$release.body).Contains($sourceMarker) -or !$release.prerelease)) {
              throw 'Existing release does not match this source commit and preview workflow.'
            }
          }
          function Wait-Release([string]$Phase, [scriptblock]$Ready, [long]$Id = 0) {
            $delays = @(1, 2, 4, 8, 8)
            for ($attempt = 0; $attempt -lt 6; $attempt++) {
              $candidate = Read-Release -Id $Id
              Assert-Source $candidate
              if ($null -ne $candidate -and (& $Ready $candidate)) { return $candidate }
              if ($attempt -lt 5) { Start-Sleep -Seconds $delays[$attempt] }
            }
            throw "GitHub release state is not ready after $Phase (6 read attempts). Existing draft/assets were retained; rerun this tag workflow."
          }
          function Recorded-Digest($candidate, [string]$Name) {
            $digestMatches = [regex]::Matches([string]$candidate.body, ('<!-- desktoprug-asset:' + [regex]::Escape($Name) + ':sha256:([a-f0-9]{64}) -->'))
            if ($digestMatches.Count -ne 1) { throw "Release must record exactly one digest for $Name; nothing was overwritten." }
            return $digestMatches[0].Groups[1].Value
          }
          function Test-AssetReady($candidate, [string]$Name, [string]$ExpectedDigest) {
            $items = @($candidate.assets | Where-Object name -CEQ $Name)
            if ($items.Count -gt 1) { throw 'Duplicate release asset names; refusing replacement.' }
            if ((Recorded-Digest $candidate $Name) -cne $ExpectedDigest) { throw "Release notes contain a conflicting digest for $Name; nothing was overwritten." }
            if ($items.Count -eq 0) { return $false }
            $actual = [string]$items[0].digest
            if ($actual -and $actual -cne "sha256:$ExpectedDigest") { throw "Release asset $Name has a conflicting SHA-256; nothing was overwritten." }
            return $items[0].state -eq 'uploaded' -and $items[0].size -gt 0 -and $actual -eq "sha256:$ExpectedDigest"
          }
          $release = Read-Release
          Assert-Source $release
          if (!$release) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --target $env:RELEASE_SOURCE --title "Desktop Rug $tag · Preview" --notes-file $notesFile --draft --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
            $release = Wait-Release -Phase 'draft creation' -Ready { param($candidate) $true }
          }
          Assert-Source $release
          $expectedDigests = @{}
          # Reject conflicts in either existing asset before uploading any missing package.
          foreach ($package in $packages) {
            $expectedDigests[$package.Name] = Recorded-Digest $release $package.Name
            $null = Test-AssetReady $release $package.Name $expectedDigests[$package.Name]
          }
          foreach ($package in $packages) {
            $name = $package.Name
            $assets = @($release.assets | Where-Object name -CEQ $name)
            if ($assets.Count -eq 0) {
              if ($expectedDigests[$name] -cne $package.Digest) {
                if (!$release.draft) { throw "Published release expects a different build of $name; no asset was replaced." }
                # Update only the missing asset's marker; preserve every already-uploaded asset digest.
                $updated = ([string]$release.body).Replace((Digest-Marker $name $expectedDigests[$name]), (Digest-Marker $name $package.Digest))
                $updated | Set-Content -LiteralPath $notesFile -Encoding utf8
                gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notesFile
                if ($LASTEXITCODE -ne 0) { throw 'Could not update draft artifact digest.' }
                $release = Wait-Release -Id $release.id -Phase "draft notes update for $name" -Ready {
                  param($candidate) (Recorded-Digest $candidate $name) -ceq $package.Digest
                }
              }
              $expectedDigests[$name] = $package.Digest
              gh release upload $tag $package.Path --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Asset upload failed for $name; rerun this workflow to resume the draft." }
            }
            $release = Wait-Release -Id $release.id -Phase "asset upload verification for $name" -Ready {
              param($candidate) Test-AssetReady $candidate $name $expectedDigests[$name]
            }
          }
          function Test-AllAssetsReady($candidate) {
            $ready = $true
            foreach ($package in $packages) {
              if (!(Test-AssetReady $candidate $package.Name $expectedDigests[$package.Name])) { $ready = $false }
            }
            return $ready
          }
          $release = Wait-Release -Id $release.id -Phase 'both assets verification' -Ready {
            param($candidate) Test-AllAssetsReady $candidate
          }
          if ($release.draft) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft=false --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; verified assets remain in the draft.' }
          }
          $release = Wait-Release -Id $release.id -Phase 'publication' -Ready {
            param($candidate) (Test-AllAssetsReady $candidate) -and !$candidate.draft -and $candidate.prerelease
          }
          "Published preview: $($release.html_url)" >> $env:GITHUB_STEP_SUMMARY
          foreach ($package in $packages) {
            $asset = @($release.assets | Where-Object name -CEQ $package.Name)
            "Download $($package.Name): $($asset[0].browser_download_url)" >> $env:GITHUB_STEP_SUMMARY
          }
